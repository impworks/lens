name: Build

on:
  push:
    branches: [master, v5]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # the .NET Framework legs and the WPF hosts need Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Lens.sln

      - name: Build
        run: dotnet build Lens.sln --configuration Release --no-restore

      - name: Test (net47)
        run: dotnet test Lens.Test/Lens.Test.csproj --configuration Release --no-build --framework net47 --logger "console;verbosity=normal"

      - name: Test (net10.0)
        run: dotnet test Lens.Test/Lens.Test.csproj --configuration Release --no-build --framework net10.0 --logger "console;verbosity=normal"

      # the debuggable backend builds the assembly a different way on .NET, so the whole suite is
      # compiled that way too. RecordWithTypeParameterInField is left out: it needs a member of
      # SomeGeneric<T[]>, which .NET 10's PersistedAssemblyBuilder cannot emit a reference to.
      - name: Test with debug info (net10.0)
        env:
          LENS_DEBUG_ALL: "1"
        run: dotnet test Lens.Test/Lens.Test.csproj --configuration Release --no-build --framework net10.0 --filter "FullyQualifiedName!~RecordWithTypeParameterInField" --logger "console;verbosity=normal"

      - name: Test with debug info (net47)
        env:
          LENS_DEBUG_ALL: "1"
        run: dotnet test Lens.Test/Lens.Test.csproj --configuration Release --no-build --framework net47 --logger "console;verbosity=normal"
